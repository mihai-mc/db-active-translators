name: "Filter MJ Database"

on:
  schedule:
    - cron: "0 6 1 */3 *"

  workflow_dispatch:

jobs:
  filter-mj-database:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download cached MJ Database
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: download-mj-database.yml
          name: mj-database
          path: output
          if_no_artifact_found: fail
          use_unzip: true

      - name: Upload MJ database
        uses: actions/upload-artifact@v4
        with:
          name: mj-database
          path: output/translators.json
          retention-days: 90

      - name: Filter MJ Database
        run: python3 src/filter-mj-db.py

      - name: Upload filtered MJ database
        uses: actions/upload-artifact@v4
        with:
          name: mj-database-filtered
          path: output/translators_filtered.json
          retention-days: 90
