name: "Cache MJ Database"

on:
  schedule:
    - cron: "0 3 1 */3 *"

  workflow_dispatch:

jobs:
  download-mj-database:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Setup Python Virtual Environment
        run: virtualenv --python=python3.13 env

      - name: Install dependencies
        run: env/bin/pip install -r requirements.txt

      - name: Verify VPN bypass
        run: |
          ip rule show | grep -q '^900:' || { echo "just-ro-bypass rule missing: sudo systemctl restart just-ro-bypass"; exit 1; }

      - name: Download MJ database
        run: env/bin/python3 src/download-mj-translators-db.py

      - name: Upload MJ database
        uses: actions/upload-artifact@v4
        with:
          name: mj-database
          path: output/translators.json
          retention-days: 90
