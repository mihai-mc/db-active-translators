name: "Cache MJ Database"

on:
  schedule:
    - cron: "0 3 1 */3 *"
  workflow_dispatch:

jobs:
  download-mj-database:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test MJ connectivity
        run: |
          curl -v --connect-timeout 30 https://www.just.ro/ 2>&1 || true
          curl -v --connect-timeout 30 https://www.just.ro/mj-dmsws/int-mj/traducatori-count 2>&1 || true

      - name: Diagnose MJ connectivity
        run: |
          getent hosts www.just.ro
          curl -4 -v --connect-timeout 30 https://www.just.ro/ 2>&1 || true

      - name: Download MJ database
        run: python3 src/download-mj-translators-db.py

      - name: Upload MJ database
        uses: actions/upload-artifact@v4
        with:
          name: mj-database
          path: output/traducatori.json
          retention-days: 90
